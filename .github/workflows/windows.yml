name: Windows startup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Unit and setup integration tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v *> test-results.txt
          $testExit = $LASTEXITCODE
          Add-Content $env:GITHUB_STEP_SUMMARY '### Test results'
          Add-Content $env:GITHUB_STEP_SUMMARY '```text'
          Get-Content test-results.txt | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Get-Content test-results.txt
          exit $testExit
      - name: Launch both BAT files and a real Tk window
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python tests/windows_launcher_smoke.py *> launcher-results.txt
          $launcherExit = $LASTEXITCODE
          Add-Content $env:GITHUB_STEP_SUMMARY '### Windows launcher results'
          Add-Content $env:GITHUB_STEP_SUMMARY '```text'
          Get-Content launcher-results.txt | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Get-Content launcher-results.txt
          if ($launcherExit -ne 0) {
            $detail = (Get-Content launcher-results.txt | Select-Object -Last 35) -join '%0A'
            Write-Output "::error title=Windows launcher failure::$detail"
          }
          exit $launcherExit
